# Optional playback settings: review and merge by hand; never auto-installed.
vo=gpu-next
gpu-api=vulkan
gpu-context=macvk
hwdec=videotoolbox
# Do not force hwdec-codecs=all: use mpv's supported codec defaults.
scale=ewa_lanczossharp
scale-antiring=0.6
cscale=ewa_lanczossharp
cscale-antiring=0.6
dscale=mitchell
# Optional, off by default to avoid unnecessary image alteration.
deband=no
deband-iterations=2
deband-threshold=32
deband-range=16
deband-grain=16
audio-buffer=0.5
# chameleon owns runtime target colors; no global HDR override is necessary.
